name: 'vilancer-bugbit'
description: >
  Review pull requests using your own Cursor agent. Supports pull_request
  (recommended) and workflow_dispatch triggers; see pr-number for manual runs.
author: 'vilancer'
branding:
  icon: 'search'
  color: 'green'

inputs:
  cursor-api-key:
    description: 'Cursor API key (pass as a secret)'
    required: true
  model:
    description: 'Cursor model id to use, e.g. composer-2.5'
    required: false
    default: 'composer-2.5'
  review-modes:
    description: >
      Comma-separated list of review modes to run. Each mode maps to a
      Cursor built-in skill (/review-bugbot, /review-security, /simplify).
      Output is read-only: findings posted as inline PR comments.
      Any of: code-review (alias review-bugbot / bugbot), security-review
      (alias review-security), simplify. code-review invokes /review-bugbot.
    required: false
    default: 'code-review'
  github-token:
    description: >
      Token used to read PR context and post review comments on pull_request
      and workflow_dispatch runs. When workflow_dispatch has no pull_request in
      the event payload, bugbit uses this token to fetch PR metadata via the API
      if pr-number is set. The consumer workflow must grant permissions:
      contents: read, pull-requests: write.
    required: true
    default: '${{ github.token }}'
  save-stream-log:
    description: >
      When true, save raw agent stream events as a JSONL artifact for debugging.
      Applies to every workflow trigger (pull_request, workflow_dispatch, etc.)
      when enabled in the consumer job. Artifact name format:
      bugbit-agent-stream-{agentRunId}-gh{githubRunId}-{YYYYMMDD-HHMMSSZ}.
      Requires actions: write on the consumer workflow job.
    required: false
    default: 'false'
  pr-number:
    description: >
      Pull request number to review. On pull_request triggers GitHub includes
      the PR in the event payload — this input is optional and ignored. Required
      for workflow_dispatch when the event has no pull_request (the default for
      manual runs). In your consumer workflow, pass the dispatch input value
      to this field (for example map your workflow's pr_number input).
    required: false
  post-clean-summary:
    description: >
      When true, posting an empty findings array via post_review creates a
      visible COMMENT review (LGTM / no findings) instead of staying silent.
      Default true.
    required: false
    default: 'true'
  clean-summary-body:
    description: >
      Markdown body for the clean-summary review when post-clean-summary is
      true and there are zero findings.
    required: false
    default: |
      ## bugbit: LGTM — no findings

      No issues reported on this diff.
  auto-describe:
    description: >
      When true, runs an additional agent pass that appends a structured PR
      description (type, bullets, mermaid, file walkthrough, test plan) after
      the developer's existing body. Runs once per PR — skipped when the
      auto-describe markers are already present. Requires pull-requests: write.
    required: false
    default: 'false'

runs:
  using: 'node24'
  main: 'dist/index.js'
